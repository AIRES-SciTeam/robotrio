name: Build and Push Docker Images

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set repository name to lowercase
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # - name: Build and push clean
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: .
      #     target: clean
      #     push: true
      #     tags: |
      #       ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/clean:${{ github.sha }}
      #       ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/clean:latest

      # - name: Build and push base
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: .
      #     target: base
      #     push: true
      #     tags: |
      #       ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/base:${{ github.sha }}
      #       ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/base:latest

      # - name: Build and push humanoid
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: .
      #     target: humanoid
      #     push: true
      #     tags: |
      #       ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/humanoid:${{ github.sha }}
      #       ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/humanoid:latest

      - name: Build and push drone
        uses: docker/build-push-action@v6
        with:
          context: .
          target: drone
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/drone:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/drone:latest

  run-in-container:
    runs-on: ubuntu-latest
    needs: build
    container:
      image: ghcr.io/aires-sciteam/robotrio/drone:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      
      - name: Installation
        run: |
          cd /robotrio/drone/install
          chmod +x *.sh
          ./MicroXRCEAgent.sh
    