name: Build and Push Docker Images

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push clean
        uses: docker/build-push-action@v5
        with:
          context: .
          target: clean
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository | toLower }}/clean:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository | toLower }}/clean:latest

      - name: Build and push base
        uses: docker/build-push-action@v5
        with:
          context: .
          target: base
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository | toLower }}/base:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository | toLower }}/base:latest

      - name: Build and push humanoid
        uses: docker/build-push-action@v5
        with:
          context: .
          target: humanoid
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository | toLower }}/humanoid:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository | toLower }}/humanoid:latest

      - name: Build and push drone
        uses: docker/build-push-action@v5
        with:
          context: .
          target: drone
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository | toLower }}/drone:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository | toLower }}/drone:latest
    