x-dev: &defaults
    entrypoint: /bin/bash
    environment:
        - DISPLAY=${DISPLAY}
        - TERM=xterm-256color
        - QT_X11_NO_MITSHM=1
        - LIBGL_ALWAYS_SOFTWARE=0
        - NVIDIA_VISIBLE_DEVICES=all
        - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
        - ./:/workspace
        - /tmp/.X11-unix:/tmp/.X11-unix:rw
        - /dev/dri:/dev/dri
        - ~/.Xauthority:/root/.Xauthority:rw
    devices:
        - /dev/dri:/dev/dri
        - /dev/snd:/dev/snd
        - /dev/input:/dev/input
    stdin_open: true
    tty: true
    privileged: true
    runtime: nvidia
    deploy:
        resources:
            reservations:
                devices:
                    - driver: nvidia
                      count: 1
                      capabilities: [gpu, compute, utility, graphics]

services:   
    clean:
        <<: *defaults
        image: registry.gitlab.com/aires_team/robotrio/clean:latest
        container_name: robotrio_clean

    base:
        <<: *defaults
        image: registry.gitlab.com/aires_team/robotrio/base:latest
        container_name: robotrio_base
        