x-dev: &defaults
    entrypoint: /bin/bash
    network_mode: host
    environment:
        - DISPLAY=${DISPLAY}
        - TERM=xterm-256color
        - QT_X11_NO_MITSHM=1
        - LIBGL_ALWAYS_SOFTWARE=0
        - NVIDIA_VISIBLE_DEVICES=all
        - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
        - ./:/robotrio
        - /tmp/.X11-unix:/tmp/.X11-unix:rw
        - ~/.Xauthority:/root/.Xauthority:rw
    devices:
        - /dev/dri:/dev/dri
        - /dev/snd:/dev/snd
        - /dev/input:/dev/input
    stdin_open: true
    tty: true
    privileged: true

services:   
    clean:
        <<: *defaults
        image: registry.gitlab.com/aires_team/robotrio/clean:latest
        container_name: robotrio_clean
        runtime: nvidia
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu, compute, utility, graphics]

    clean-cpu:
        <<: *defaults
        image: registry.gitlab.com/aires_team/robotrio/clean:latest
        container_name: robotrio_clean_cpu

    base:
        <<: *defaults
        image: registry.gitlab.com/aires_team/robotrio/base:latest
        container_name: robotrio_base
        runtime: nvidia
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu, compute, utility, graphics]
    
    base-cpu:
        <<: *defaults
        image: registry.gitlab.com/aires_team/robotrio/base:latest
        container_name: robotrio_base_cpu

    humanoid:
        <<: *defaults
        image: registry.gitlab.com/aires_team/robotrio/humanoid:latest
        container_name: robotrio_humanoid
        runtime: nvidia
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu, compute, utility, graphics]
        
    humanoid-cpu:
        <<: *defaults
        image: registry.gitlab.com/aires_team/robotrio/humanoid:latest
        container_name: robotrio_humanoid_cpu

    drone:
        <<: *defaults
        image: registry.gitlab.com/aires_team/robotrio/drone:latest
        container_name: robotrio_drone
        runtime: nvidia
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu, compute, utility, graphics]
        
    drone-cpu:
        <<: *defaults
        image: registry.gitlab.com/aires_team/robotrio/drone:latest
        container_name: robotrio_drone_cpu
