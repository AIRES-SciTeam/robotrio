[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotrio.dog"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "xgolib", 
  "picamera2", 
  "pupil_apriltags",
  "opencv-python",
  "numpy"
]

[project.scripts]
"robotrio.dog" = "robotrio_dog.main:main"
"robotrio.dog.test" = "robotrio_dog.test:camera"      

[tool.setuptools.packages.find]
where = ["src"]
include = ["robotrio_dog*"]
