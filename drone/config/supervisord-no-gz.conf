[supervisord]
nodaemon=true
logfile=/robotrio/logs/supervisord.log
pidfile=/robotrio/logs/supervisord.pid
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
user=root

[program:microxrceagent]
command=MicroXRCEAgent udp4 -p 8888
autostart=true
autorestart=true
startretries=3
stdout_logfile=/robotrio/logs/drone_xrce.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
redirect_stderr=true

