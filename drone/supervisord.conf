[supervisord]
nodaemon=true
logfile=/robotrio/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/robotrio/logs/supervisord.pid
user=root

[program:microxrce_agent]
command=MicroXRCEAgent udp4 -p 8888
autostart=true
autorestart=true
startretries=3
stdout_logfile=/robotrio/logs/microxrce_agent.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
redirect_stderr=true

[program:ros_gz_bridge]
command=/bin/bash -c "source /opt/ros/jazzy/setup.bash && ros2 launch ros_gz_bridge ros-gz-bridge.launch.py"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/robotrio/logs/ros_gz_bridge.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
redirect_stderr=true
environment="RMW_IMPLEMENTATION=rmw_fastrtps_cpp"
